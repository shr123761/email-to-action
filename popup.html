<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Email Info</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h3>Email to Action Request</h3>

  <div id="emailContainer">
    <div id="loading">⏳ Loading emails...</div>
  </div>

  <div id="validationMessage" style="color: red; margin-top: 6px; display: none;">
    Please fill all the fields.
  </div>

  <!-- Unit, Condo, Type, Notes -->
  <div id="unitNotesContainer" style="margin-top: 12px; display: none;">
    <div class="form-row">
      <label for="unitInput"><strong>Unit:</strong></label>
      <input type="text" id="unitInput" />
    </div>

    <div class="form-row">
      <label for="condoCode"><strong>Condo Name (3-letter):</strong></label>
      <input type="text" id="condoCode" maxlength="3" placeholder="ABC" />
    </div>

    <div class="form-row">
      <label for="typeSelect"><strong>Type:</strong></label>
      <select id="typeSelect" required>
        <option value="">-- Select Type --</option>
        <option value="Admin Request">Admin Request</option>
        <option value="Maintenance Request">Maintenance Request</option>
        <option value="Complaint">Complaint</option>
        <option value="Feedback">Feedback</option>
        <option value="Others">Others</option>
      </select>
    </div>

    <!-- ✅ NEW NOTES FIELD -->
    <div class="form-row">
      <label for="notesInput"><strong>Notes (Name - Email - Nnit):</strong></label>
      <input
        type="text"
        id="notesInput"
        placeholder="e.g. Shrey Agrawal - shreyagrawal499@gmail.com - A123"
      />
    </div>
  </div>

  <!-- Preview section -->
  <div id="previewContainer" style="display: none; margin-top: 14px;">
    <h4>📬 Preview of Send Task</h4>
    <div><strong>Title:</strong> <span id="previewSubject"></span></div>
    <div><strong>Date:</strong> <span id="previewDate"></span></div>
    <div><strong>Unit:</strong> <span id="previewUnit"></span></div>
    <div><strong>Type:</strong> <span id="previewType"></span></div>
    <div><strong>Condo:</strong> <span id="previewCondoCode"></span></div>
    <div><strong>Notes:</strong> <span id="previewNotes"></span></div> <!-- ✅ NEW PREVIEW LINE -->
    <div><strong>Details:</strong></div>
    <div id="previewBody"></div>
  </div>

  <button id="sendButton">Send Data to Converge</button>
  <button id="resetTutorialBtn">Reset Tutorial</button>

  <script src="popup.js"></script>
</body>
</html>
